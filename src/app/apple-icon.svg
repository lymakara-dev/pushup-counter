<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2" />
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />

  <!-- Ambient Glow Behind Athlete -->
  <circle cx="280" cy="270" r="160" fill="url(#glowGrad)" />

  <!-- Ground Line -->
  <line x1="72" y1="390" x2="440" y2="390" stroke="url(#groundGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Upward Rep Energy Motion Chevrons -->
  <path d="M 230 180 L 260 152 L 290 180" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M 238 142 L 260 122 L 282 142" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

  <!-- Background Arm (depth) -->
  <polyline points="360,218 392,284 340,384" fill="none" stroke="#047857" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Head -->
  <circle cx="420" cy="176" r="32" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)" />

  <!-- Body / Torso Plank Line (Feet to Shoulders) -->
  <polyline points="104,382 236,298 360,218" fill="none" stroke="url(#emeraldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Forearm and Arm (Foreground) -->
  <polyline points="360,218 406,288 362,384" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Biomechanical Landmark Tracking Nodes -->
  <!-- Ankle / Feet -->
  <circle cx="104" cy="382" r="9" fill="#ffffff" stroke="#10b981" stroke-width="4" />

  <!-- Hip -->
  <circle cx="236" cy="298" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" />

  <!-- Shoulder -->
  <circle cx="360" cy="218" r="11" fill="#ffffff" stroke="#10b981" stroke-width="5" />

  <!-- Elbow -->
  <circle cx="406" cy="288" r="10" fill="#ffffff" stroke="#06b6d4" stroke-width="4" />

  <!-- Hand / Wrist -->
  <circle cx="362" cy="384" r="8" fill="#ffffff" stroke="#10b981" stroke-width="4" />
</svg>
